name: local-news

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-localnews}
      POSTGRES_USER: ${POSTGRES_USER:-localnews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/settings.sql:/docker-entrypoint-initdb.d/02-settings.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localnews}"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    image: local-news-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-localnews}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-localnews}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: ./backend
    image: local-news-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-localnews}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-localnews}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  scheduler:
    build: ./backend
    image: local-news-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-localnews}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-localnews}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media:/data
    depends_on:
      redis:
        condition: service_healthy
    command: python -m app.workers.scheduler

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/data:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media:
